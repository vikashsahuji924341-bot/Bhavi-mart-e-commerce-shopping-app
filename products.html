<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BHAVI MART - Products</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      padding: 20px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product h3 {
      margin: 10px 0 5px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1>BHAVI MART</h1>
  <p>Premium Products • Existing Deals • Rewards</p>
</header>

<div class="products">

  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Product+1" alt="Product 1">
    <h3>Premium Product 1</h3>
    <div class="price">₹499</div>
    <a class="btn" href="#">Buy Now</a>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Product+2" alt="Product 2">
    <h3>Premium Product 2</h3>
    <div class="price">₹799</div>
    <a class="btn" href="#">Buy Now</a>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/300x200?text=Product+3" alt="Product 3">
    <h3>Premium Product 3</h3>
    <div class="price">₹999</div>
    <a class="btn" href="#">Buy Now</a>
  </div>

</div>

</body>
</html>
